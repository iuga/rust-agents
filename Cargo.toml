[package]
name = "rust-agent"
version = "0.1.0"
edition = "2024"
default-run = "rust-agent"

[features]
desktop = ["dep:gpui-kit", "dep:tray-icon", "dep:resvg", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[[bin]]
name = "chat"
path = "src/bin/chat.rs"
required-features = ["desktop"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
uuid = { version = "1", features = ["v7"] }
regex = "1.13.1"
rig = "0.42.0"
rmcp = {
    version = "3.3.0",
    features = [
        "server",
        "macros",
        "transport-streamable-http-server"
    ]
}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "rt", "sync"] }
tokio-util = "0.7.19"
walkdir = "2.5.0"
sha2 = "0.11.0"
lancedb = { version = "0.39.0", features = ["remote"] }
futures = "0.3.34"
serde_arrow = { version = "0.15.1", features = ["arrow-58"] }
chrono = "0.4.45"
config = "0.15.26"
chunkedrs = "2.1.1"
gpui-kit = { version = "0.7.3", optional = true }
tray-icon = { version = "0.26.1", optional = true }
resvg = { version = "0.46", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"], optional = true }
